# Database Configuration (supports env variables for cloud deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Server Configuration (Render dynamically assigns PORT)
server.port=${PORT:8080}

# App Name
spring.application.name=shms-backend

# Security & JWT Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
app.jwt.secret=${APP_JWT_SECRET:SHMSSecretKeyForJWTTokenGenerationMustBe256BitsLongAtLeast12345}
app.jwt.expiration=86400000

# CORS Allowed Origins (Comma-separated for local and production URLs)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Notification Service
app.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:5000/api/notify}


# ==========================================
# Default Super Admin Configuration
# ==========================================
superadmin.name=Super Admin
superadmin.email=superadmin@shms.com
superadmin.phone=9999999999
superadmin.password=SuperAdmin@123
superadmin.language=EN


